# /etc/nginx/sites-available/web-publica - ETAPA 2 (final): HTTPS con Let's Encrypt + redireccion HTTP->HTTPS
# Servidor web publico de Ventas (qr-vm-web-dmz, DMZ, EduCloud)

# Puerto 80: solo redirige a HTTPS (y deja pasar la validacion de Let's Encrypt para renovar)
server {
    listen 80 default_server;
    server_name educloud.dulceambrosio.me;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;    # 301 = redireccion permanente
    }
}

# Puerto 443: el sitio real, cifrado con TLS
server {
    listen 443 ssl http2 default_server;     # nginx 1.22 (Debian 12) usa esta sintaxis para HTTP/2
    server_name educloud.dulceambrosio.me;

    root  /var/www/publica;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Certificado emitido por Let's Encrypt (renovacion automatica con certbot.timer)
    ssl_certificate     /etc/letsencrypt/live/educloud.dulceambrosio.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/educloud.dulceambrosio.me/privkey.pem;

    # Solo versiones seguras de TLS (SSLv3, TLS 1.0 y 1.1 estan obsoletas)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=86400" always;   # HSTS: el navegador recuerda usar HTTPS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/web-publica_access.log;
    error_log  /var/log/nginx/web-publica_error.log;
}
