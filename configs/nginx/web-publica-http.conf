# /etc/nginx/sites-available/web-publica - ETAPA 1 (solo HTTP, temporal)
# Sirve la pagina por el puerto 80 y la ruta que Let's Encrypt usa para validar el dominio.
# Cuando ya existe el certificado se reemplaza por web-publica.conf (HTTPS + redireccion).

server {
    listen 80 default_server;
    server_name educloud.dulceambrosio.me;

    root  /var/www/publica;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Validacion HTTP-01: Let's Encrypt descarga un archivo de esta ruta
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
