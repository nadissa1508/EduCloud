# /etc/nginx/sites-available/intranet - Intranet de RR. HH. (qr-vm-intranet, EduCloud)

server {
    listen 80 default_server;
    server_name rrhh.educloud.local intranet.educloud.local;

    root  /var/www/rrhh;
    index index.html;
    charset utf-8;

    # Hardening: no mostrar la version de nginx en errores ni cabeceras
    server_tokens off;

    # ACL a nivel de aplicacion (segunda capa ademas del firewall de VPC):
    # solo subredes de empleados. Visitas, DMZ e Internet reciben 403.
    allow 10.20.0.0/26;     # Ventas
    allow 10.20.0.128/27;   # TI
    allow 10.20.0.160/28;   # Data Center
    allow 127.0.0.1;        # pruebas locales
    deny  all;

    # Cabeceras de seguridad basicas
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/intranet_access.log;
    error_log  /var/log/nginx/intranet_error.log;
}
